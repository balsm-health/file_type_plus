name: file_type_plus
version: 1.1.0
description: >-
  Categorize files into high-level types (image, audio, video, document, HTML,
  archive) from extensions, MIME types, paths, URLs, or magic-number bytes.
repository: https://github.com/hossameldinmi/file_type_plus.git
topics:
  - mime
  - mimetype
  - file-extensions
  - file-type
  - media-type

environment:
  sdk: ^3.7.0

dependencies:
  equatable: ^2.0.7
  mime: ^2.0.0

dev_dependencies:
  cross_file: ^0.3.4+2
  dart_flutter_team_lints: ^3.0.0
  test: ^1.26.3
